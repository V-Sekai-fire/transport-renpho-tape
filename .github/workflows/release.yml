name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64, ext: tar.gz }
          - { os: ubuntu-latest, name: linux-x64, ext: tar.gz }
          - { os: windows-latest, name: windows-x64, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev pkg-config
          lake build -Kcflags="$(scripts/linux-flags.sh cflags)" -Klinklibs="$(scripts/linux-flags.sh libs)"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: lake build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: lake build
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build WinRT DLL
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build-win-dll.bat

      # Stage the exact binary names, not a glob: Lake leaves .trace/.hash sidecars beside them.
      - name: Stage
        shell: bash
        run: |
          d=renpho-tape-${{ matrix.name }}
          mkdir -p "$d"
          if [ "$RUNNER_OS" = Windows ]; then
            cp .lake/build/bin/renpho-tape.exe .lake/build/bin/renpho_ble_win.dll "$d/"
            cp deploy/install-windows.ps1 "$d/"
          else
            cp .lake/build/bin/renpho-tape "$d/"
            cp deploy/renpho-tape.service deploy/com.chibifire.renpho-tape.plist "$d/"
          fi
          cp README.md "$d/"
          ls -l "$d"
          # Gate on the artifact: a few bytes means a sidecar was staged.
          for f in "$d"/renpho-tape*; do [ "$(wc -c < "$f")" -gt 100000 ] || { echo "$f too small"; exit 1; }; done
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$d.zip" "$d" >/dev/null; else tar czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: renpho-tape-${{ matrix.name }}.${{ matrix.ext }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          # v1.2.3-dev.1 / -rc.1 are prereleases, plain v1.2.3 is a full release.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
